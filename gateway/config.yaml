# LiteLLM Gateway config — the concrete implementation of the "LLM Gateway" component
# in the master plan. Model names on the left (model_name) are what Hermes and every
# future agent call — they never see the provider-specific name on the right, which is
# the whole point: swap providers here without touching agent code.
#
# Tiers and per-agent assignment below follow the master plan's section 6.8, worked out
# in full in the vault note "LLM Cost & Model Routing — Reference Notes" — read that for
# the reasoning (pricing, benchmarks, why each agent gets the tier it gets). Section 6.12
# covers frontier/premium moving to AWS Bedrock, Experiential Labs dropped, and a real
# bug in the `cheap` waterfall's ordering fixed. Section 6.13 covers cheap-reliable
# (Haiku) also moving to Bedrock, and the decision to keep premium-fallback on direct
# OpenAI rather than Bedrock's OpenAI models (different auth mechanism, no portal saved).
#
# Four portals now manage every key here: Groq, Cerebras, OpenRouter, AWS (one set of
# creds covers frontier/premium/cheap-reliable/bedrock-nova-micro) — plus OpenAI, kept
# deliberately separate as premium-fallback's AWS-independent reliability path.
#
# Week 1 only needs `cheap` and `premium` working end-to-end. Everything else here is
# real but doesn't need to be filled in (i.e. keys added) until the agent that uses it
# gets built.

model_list:
  # --- Tier S/A: stakes-appropriate. Real money, real reasoning, the orchestrator.
  # Both now on AWS Bedrock (master plan 6.12) — no pricing markup vs. calling Anthropic
  # direct, IAM auth instead of another bearer key in .env. No `api_key` param: Bedrock
  # auth comes from the standard AWS credential chain (env vars, an AWS profile, or an
  # instance role once this runs on EC2/ECS) — passing `api_key` here breaks that chain.
  #
  # TROUBLESHOOTING (6.15) — "BedrockException Invalid Authentication: The security token
  # included in the request is invalid": AWS didn't recognize the credentials at all, not
  # a permissions/model-access problem (that error reads differently — AccessDeniedException).
  # Checked in order:
  #  1. Trailing whitespace/newline on AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in .env —
  #     easy to introduce copy-pasting from the AWS console.
  #  2. If these are TEMPORARY credentials (from `aws sso login`, IAM Identity Center, or
  #     any STS AssumeRole flow) rather than a long-lived IAM user's access keys: they
  #     need a THIRD variable, AWS_SESSION_TOKEN, or they're incomplete and read as
  #     invalid. Not in .env.example before this fix — added below.
  #  3. The access key itself may be deactivated/rotated/deleted in IAM — check the IAM
  #     console directly.
  #  4. Fastest isolation test if the AWS CLI is installed: export the same three (or
  #     four) vars in a shell and run `aws sts get-caller-identity` — if THAT fails the
  #     same way, it's the credentials, not LiteLLM or this config.
  - model_name: frontier          # Trading Agent only (Phase 7) — highest stakes, hardest reasoning
    litellm_params:
      model: bedrock/anthropic.claude-opus-4-1-20250805-v1:0   # verify exact model ID in the Bedrock console — these differ slightly from direct-API strings and change often
      aws_region_name: os.environ/AWS_REGION_NAME

  - model_name: premium            # JARVIS Core, Finance/Investment, Health, technical Learning
    litellm_params:
      model: bedrock/anthropic.claude-sonnet-4-5-20250929-v1:0   # verify exact model ID in the Bedrock console
      aws_region_name: os.environ/AWS_REGION_NAME

  # --- Tier A/B: the "near-default middle" — cheap enough to default to, capable enough
  # to be a real fallback for premium-tier work. Not on Bedrock — NVIDIA Nemotron isn't
  # one of Bedrock's hosted model families.
  #
  # FIXED (6.15, live-tested): `nemotron-3-super` never existed as an OpenRouter slug —
  # the "confirm exact slug" TODO here was never actually verified and the proxy 400'd on
  # every real call. Confirmed via OpenRouter's own live model API: the real current model
  # is nemotron-3.5-lightning ($0.08/$0.20 per MTok, 262K context) — smaller than what was
  # assumed (3B active/30B total MoE vs. the imagined near-405B-class model), but real and
  # working, which the old entry wasn't. Re-benchmark before assuming it's still the right
  # default if `premium`-tier work starts leaning on `mid` heavily.
  - model_name: mid
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-lightning
      api_key: os.environ/OPENROUTER_API_KEY

  # --- Tier C: free, rate-limited, high-volume/low-stakes work (News, Life Planner,
  # English/personality practice). `cheap` (below) IS this tier's entry point — see the
  # router_settings.fallbacks note for why that matters. Rate limits here are corrected
  # as of master plan 6.12 after checking each provider's own docs directly — published
  # figures vary a lot across third-party write-ups, so re-verify on each provider's own
  # live limits page before treating any of this as exact.
  # FIXED (6.15, live-tested): llama-3.3-70b-versatile has moved to Groq's Enterprise-only
  # tier (confirmed via Groq's own model docs) and now 404s for a normal account. Groq's
  # free-plan-eligible catalog currently centers on the OpenAI open-weight gpt-oss models
  # instead — swapped to gpt-oss-120b. Re-check console.groq.com/settings/limits for this
  # model's actual rate limits on your account; the old 30 RPM/6K TPM figure was measured
  # against the now-dead model, not this one.
  - model_name: free-groq
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY

  - model_name: free-cerebras
    litellm_params:
      model: cerebras/gpt-oss-120b   # CHANGED from llama-3.3-70b (6.12): that model wasn't confirmed on Cerebras' free tier; gpt-oss-120b and qwen-3.8-27b are, per Cerebras' own docs
      api_key: os.environ/CEREBRAS_API_KEY
      # 5 RPM / 30K TPM (uncached) / 1M TPD per Cerebras' own docs — meaningfully more
      # restrictive than earlier notes here assumed (30 RPM/60K TPM was wrong).
      #
      # LIVE ERROR (6.15): "Payment required to access this resource. Visit your billing
      # tab." Cerebras' own pricing page now reads "$5 in free credits after making an
      # account" rather than describing an indefinite no-cost rate-limited tier the way it
      # did when this was first written — their model may have shifted to a capped free
      # trial. Check cloud.cerebras.ai's billing tab: this may just need a card on file to
      # unlock the credit, or the $5 may already be spent. If Cerebras has genuinely gone
      # trial-only, this rung's place in the "genuinely free" waterfall needs revisiting.

  # FIXED (6.15, live-tested): OpenRouter's own error on this exact slug: "This model is
  # unavailable for free. The paid version is available now." The :free Llama 3.3 70B
  # endpoint was retired. Swapped to nemotron-3.5-lightning:free — confirmed live via
  # OpenRouter's own model API as currently real and $0. Smaller than the old Llama slug
  # (3B active/30B total MoE), but working. Free-model slugs on OpenRouter churn — expect
  # to re-verify this again eventually, not just once.
  - model_name: free-openrouter
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-lightning:free
      api_key: os.environ/OPENROUTER_API_KEY
      # Old RPM/RPD figures (20 RPM / 50 RPD no credits, 1,000 RPD with $10+ credits) were
      # OpenRouter-account-wide, not model-specific, so likely still roughly apply — not
      # re-verified against this specific model, worth a spot-check on your account.
      #
      # Privacy (checked directly, 6.13): OpenRouter doesn't log prompts/completions by
      # default and excludes logging/unconfirmed providers from routing unless you opt in
      # (off by default). Which backend host actually serves a :free request can still
      # vary by model/provider — fine for routine stuff; still don't send finance/health/
      # vault content here. Full reasoning: docs/MODEL_ROUTING.md.

  # --- Replaces the old Experiential Labs free rung (dropped, 6.12): a stable, cheap,
  # no-promotional-pricing-cliff-risk rung on AWS Bedrock. Not free, but $0.035/$0.14 per
  # MTok is close enough to it that it's a safe, permanent price to fall through to —
  # unlike Experiential's promo models, this price doesn't disappear. No `api_key`: same
  # AWS credential chain as frontier/premium above.
  - model_name: bedrock-nova-micro
    litellm_params:
      model: bedrock/amazon.nova-micro-v1:0   # verify exact model ID in the Bedrock console
      aws_region_name: os.environ/AWS_REGION_NAME

  # --- cheap: THE ENTRY POINT for the cost-minimization waterfall — deliberately the
  # SAME deployment as free-groq (see router_settings.fallbacks below for why). Agents
  # call `cheap`; the gateway decides underneath it how far to escalate before paying.
  - model_name: cheap
    litellm_params:
      model: groq/openai/gpt-oss-120b   # kept in sync with free-groq above (6.15) — same fix, same reason
      api_key: os.environ/GROQ_API_KEY

  # --- Renamed from the old `cheap` (6.12): this was Haiku pretending to be the free
  # tier's entry point, which meant every `cheap` call paid Haiku's price FIRST and only
  # touched free providers during an Anthropic outage — backwards from the whole point
  # of a cost-minimization waterfall. Now correctly positioned as the LAST resort in
  # `cheap`'s fallback chain, below, once every free option and `mid` have been tried.
  # Moved to AWS Bedrock (6.13) — same mechanism as frontier/premium above: no pricing
  # markup vs. direct Anthropic, no `api_key` (AWS credential chain), one fewer portal
  # (ANTHROPIC_API_KEY is now unused anywhere in this config).
  - model_name: cheap-reliable
    litellm_params:
      model: bedrock/anthropic.claude-haiku-4-5-20251001-v1:0   # verify exact model ID in the Bedrock console
      aws_region_name: os.environ/AWS_REGION_NAME

  # --- second Anthropic-independent provider, so "model-agnostic" is proven day one ---
  # DECIDED, staying put (6.13): OpenAI models (GPT-5.4/5.5, not GPT-4o — that's not
  # offered) did go GA on AWS Bedrock in 2026, confirmed via AWS's own docs — but they
  # don't use the same mechanism as Claude/Nova on Bedrock above: a separate
  # `bedrock-mantle` endpoint + OpenAI Responses API + a Bedrock-issued bearer token, NOT
  # the IAM credential chain, and region-locked (GPT-5.5: us-east-2 only). Moving this
  # here would trade one credential (OPENAI_API_KEY) for another (a Bedrock API key)
  # rather than actually removing a portal, and would fold the last non-AWS reliability
  # fallback into the same cloud as everything else. Deliberately left on direct OpenAI —
  # this is the one fallback that survives an AWS-wide outage. See master plan 6.13.
  - model_name: premium-fallback
    litellm_params:
      model: gpt-4o   # flagged as dated (late 2026) — worth bumping to a current OpenAI model at some point, independent of the Bedrock question
      api_key: os.environ/OPENAI_API_KEY

  # --- experimental: broad open-model catalog via OpenRouter, for trying/comparing
  # models. NOT wired into any fallback chain on purpose — several models in this wider
  # catalog (and Gemini-hosted ones reachable through it) train on free-tier inputs/
  # outputs by provider policy, unlike free-openrouter's specific Llama endpoint below
  # (checked directly, 6.13 — see docs/MODEL_ROUTING.md's privacy section). A bad fit for
  # anything touching your personal data. Call this deliberately (`/model experimental` in
  # Hermes), never let it fire automatically.
  - model_name: experimental
    litellm_params:
      model: openrouter/qwen/qwen3.8-flash   # swap freely — same alias either way
      api_key: os.environ/OPENROUTER_API_KEY

router_settings:
  # Two different kinds of fallback, don't conflate them:
  # 1. Reliability fallback (premium, frontier): if the primary provider errors/is down,
  #    retry on a different provider at roughly the same capability tier.
  # 2. Cost-minimization waterfall (cheap): `cheap` itself resolves to the FREE Groq
  #    deployment (see model_list above) — its fallback chain below is what actually
  #    implements "try every free option, then the cheapest paid option, before ever
  #    touching a pricier one." Ordered by real per-token cost, cheapest first:
  #    free-cerebras/free-openrouter ($0) -> bedrock-nova-micro ($0.035/$0.14) ->
  #    mid/Nemotron ($0.085/$0.40) -> cheap-reliable/Haiku ($1/$5, last resort).
  fallbacks:
    - { "frontier": ["premium"] }
    - { "premium": ["premium-fallback", "mid"] }
    - { "cheap": ["free-cerebras", "free-openrouter", "bedrock-nova-micro", "mid", "cheap-reliable"] }
    # Found while fixing the above (docs/MODEL_ROUTING.md claimed Career & Income's `mid`
    # calls fall back through the free tiers, but no such chain was ever configured here —
    # `mid` had no fallback at all. Added one: if OpenRouter/Nemotron itself errors, degrade
    # to the free tiers rather than failing outright.
    - { "mid": ["free-cerebras", "free-openrouter", "bedrock-nova-micro"] }

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Points spend/budget tracking at the SAME Postgres already planned for memory/pgvector
  # (master plan 6.3) — one DB, not two. This isn't optional decoration: LiteLLM's budget
  # enforcement (litellm_settings.max_budget below) requires Postgres, the default local
  # SQLite doesn't support it. Commented out until that Postgres instance actually exists
  # (Phase 2) — uncomment once DATABASE_URL is set in .env. Until then, spend still gets
  # tracked locally (SQLite), just not budget-enforced.
  #
  # GOTCHA (hit during Week 1 testing): this line being commented out is NOT enough on its
  # own. LiteLLM also reads the raw DATABASE_URL env var directly at startup, regardless of
  # whether this config.yaml line is active — so a present-but-empty DATABASE_URL in .env
  # (uncommented, no value) crashes the proxy with "unsupported scheme '<missing scheme>'"
  # even with this line commented out. .env.example now keeps DATABASE_URL commented out
  # too, not just blank — keep it that way until Phase 2's Postgres actually exists.
  # database_url: os.environ/DATABASE_URL

# Token Optimiser + Cost/Usage HUD backend — master plan 6.9. Both entries below are
# config-only, no code, on from Week 1.
litellm_settings:
  # Auto-injects `cache_control` breakpoints on the system prompt + trailing turn for
  # Claude calls — no per-agent changes needed. This is section 6.8's "prompt caching,
  # biggest lever" made concrete: a cached read is billed around 10% of a fresh input
  # read (verify against current Anthropic pricing before relying on the exact number).
  # 1h TTL instead of the 5-minute default, since JARVIS Core and Finance hit the same
  # system prompt repeatedly across a day, not back-to-back.
  #
  # UNVERIFIED since frontier/premium moved to Bedrock (6.12): this flag's auto-injection
  # was built and tested against direct Anthropic model strings — LiteLLM's own GitHub
  # has open issues specifically about cache-control injection for Bedrock-hosted Claude,
  # so don't assume this "just works" for bedrock/anthropic.* the same way. Smoke-test it
  # in Week 1 (check for a cache-read line in the response, or in /spend/logs) — if it's
  # not triggering, the fallback is `cache_control_injection_points` set explicitly on
  # the frontier/premium model_list entries above (see docs.litellm.ai/docs/tutorials/prompt_caching).
  enable_anthropic_prompt_caching: true
  anthropic_prompt_caching_ttl: "1h"

  # Hard proxy-wide ceiling, matching the $10-30/month estimate in 6.8 with headroom.
  # Doesn't reduce tokens — it caps the damage if the optimiser or routing table has a
  # bug. Requires general_settings.database_url above to actually be enforced; raise
  # this once real usage data says the estimate was wrong.
  max_budget: 30
  budget_duration: "30d"
